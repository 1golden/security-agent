[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "0.1.0"
description = "Pluggable agent-policy framework: pre/post-retrieval and memory-write policies over RAG + agent memory"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "1golden"}]
keywords = ["agent", "memory", "rag", "llm", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "tenacity>=8.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "httpx>=0.27"]
amem = ["chromadb>=0.5", "sentence-transformers>=2.7"]
rag = ["faiss-cpu>=1.7", "rank-bm25>=0.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = ["security-agent[llm,amem,rag,dev]"]

[project.scripts]
security-agent = "security_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
